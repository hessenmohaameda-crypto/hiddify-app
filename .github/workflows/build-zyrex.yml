name: Build Zyrex VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Prepare Android dependencies
        run: make android-apk-install-deps

      - name: Prepare Android
        run: make android-apk-prepare

      - name: Build APK
        run: make android-apk-release

      - name: Find APK files
        run: |
          find ./build -name "*.apk" -type f
          ls -la ./build/app/outputs/flutter-apk/ || echo "no apk dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zyrex-vpn-apk
          path: ./build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: warn
